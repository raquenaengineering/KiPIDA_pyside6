[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kipida"
dynamic = ["version"]  # single source: kipida/__init__.py (__version__)
description = "Ki-PIDA: KiCad Power Integrity & Delivery Analyzer (DC IR-drop plugin)"
readme = "README.md"
license = "AGPL-3.0-or-later"
# Target: KiCad 10. On Windows/macOS KiCad runs IPC plugins with its bundled
# interpreter (Python 3.11.5 in KiCad 10.0.x), so code must stay 3.11-compatible
# even though the dev venv may be newer.
requires-python = ">=3.11"
# Runtime deps are duplicated in requirements.txt, which KiCad reads when it
# builds the plugin's own environment. Keep both lists in sync.
dependencies = [
    "numpy",
    "scipy",
    "shapely>=2.0",  # contains_xy (mesher)
    "matplotlib",
    "kicad-python>=0.7.0",  # 0.7.0 is the first release targeting KiCad 10
    "pypardiso",
    "PySide6-Essentials~=6.12.0",  # abi3 wheels, Python 3.10-3.15
    "pyqtgraph~=0.14.0",           # result plots
    "PyOpenGL~=3.1",               # 3D view (pyqtgraph.opengl)
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.dynamic]
version = { attr = "kipida.__version__" }

[tool.setuptools.packages.find]
include = ["kipida*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
